version: "3.9"
services:

  assetservice:
    build:
      context: .
      dockerfile: AssetService.API/Dockerfile
    ports:
      - "5001:8080"   # HTTP port mapping for AssetService
      - "5002:8081"   # HTTPS port mapping if needed
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=AssetDb;User Id=sa;Password=My!Passw0rd;TrustServerCertificate=True;
    depends_on:
      - db

  authservice:
    build:
      context: .
      dockerfile: AuthService.API/Dockerfile
    ports:
      - "5003:8080"
      - "5004:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=AuthDb;User Id=sa;Password=My!Passw0rd;TrustServerCertificate=True;
    depends_on:
      - db

  clientservice:
    build:
      context: .
      dockerfile: ClientService.API/Dockerfile
    ports:
      - "5005:8080"
      - "5006:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=ClientDb;User Id=sa;Password=My!Passw0rd;TrustServerCertificate=True;
    depends_on:
      - db

  inspectionservice:
    build:
      context: .
      dockerfile: InspectionService.API/Dockerfile
    ports:
      - "5007:8080"
      - "5008:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=InspectionDb;User Id=sa;Password=My!Passw0rd;TrustServerCertificate=True;
    depends_on:
      - db

  notificationservice:
    build:
      context: .
      dockerfile: NotificationService.API/Dockerfile
    ports:
      - "5009:8080"
      - "5010:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=NotificationDb;User Id=sa;Password=My!Passw0rd;TrustServerCertificate=True;
    depends_on:
      - db

  reportservice:
    build:
      context: .
      dockerfile: ReportService.API/Dockerfile
    ports:
      - "5011:8080"
      - "5012:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=ReportDb;User Id=sa;Password=My!Passw0rd;TrustServerCertificate=True;
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "My!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
